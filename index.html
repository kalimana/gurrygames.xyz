<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>...</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #020202;
            font-family: "Courier New", monospace;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ddd;
            position: relative;
        }

        /* Dark vignette */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background:
                radial-gradient(
                    ellipse at center,
                    transparent 20%,
                    rgba(0, 0, 0, 0.55) 65%,
                    #000 100%
                );
            z-index: 5;
        }

        /* Scanlines */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            opacity: 0.13;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 3px,
                #fff 4px
            );
        }

        .noise {
            position: fixed;
            inset: -50%;
            pointer-events: none;
            opacity: 0.035;
            z-index: 4;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            animation: noise 0.15s steps(2) infinite;
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 6;
        }

        h1 {
            font-size: clamp(1.4rem, 4vw, 3rem);
            font-weight: 400;
            letter-spacing: 5px;
            color: #d7d7d7;
            text-shadow:
                0 0 5px rgba(255,255,255,0.2),
                0 0 25px rgba(255,0,0,0.15);
            animation:
                appear 4s ease forwards,
                flicker 7s infinite;
            opacity: 0;
        }

        .cursor {
            display: inline-block;
            width: 9px;
            height: 1.1em;
            margin-left: 6px;
            vertical-align: middle;
            background: #9b0000;
            box-shadow: 0 0 10px #ff0000;
            animation: blink 1s infinite;
        }

        /* Random red glow */
        .red-glow {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: rgba(100, 0, 0, 0.08);
            filter: blur(100px);
            animation: pulse 6s infinite ease-in-out;
            z-index: 1;
        }

        @keyframes appear {
            0% {
                opacity: 0;
                transform: translateY(10px);
                filter: blur(8px);
            }

            70% {
                opacity: 0.8;
                filter: blur(1px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        @keyframes flicker {
            0%, 18%, 22%, 63%, 64%, 65%, 100% {
                opacity: 1;
            }

            19%, 21%, 62%, 63.5% {
                opacity: 0.25;
            }
        }

        @keyframes blink {
            0%, 45% {
                opacity: 1;
            }

            46%, 100% {
                opacity: 0;
            }
        }

        @keyframes noise {
            0% {
                transform: translate(0, 0);
            }

            25% {
                transform: translate(3%, -2%);
            }

            50% {
                transform: translate(-2%, 3%);
            }

            75% {
                transform: translate(2%, 2%);
            }

            100% {
                transform: translate(-3%, -1%);
            }
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(0.8);
                opacity: 0.25;
            }

            50% {
                transform: scale(1.15);
                opacity: 0.5;
            }
        }

        /* Occasional screen glitch */
        .glitch {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 8;
            animation: glitch 9s infinite;
            opacity: 0;
        }

        @keyframes glitch {
            0%, 88%, 100% {
                opacity: 0;
            }

            89% {
                opacity: 0.08;
                background: rgba(255, 0, 0, 0.15);
            }

            90% {
                opacity: 0;
            }

            91% {
                opacity: 0.05;
                transform: translateX(5px);
            }

            92% {
                opacity: 0;
                transform: translateX(0);
            }
        }
    </style>
</head>

<body>

    <div class="red-glow"></div>
    <div class="noise"></div>
    <div class="glitch"></div>

    <div class="container">
        <h1>
            Hey. More games on the way<span class="cursor"></span>
        </h1>
    </div>

</body>
</html>
